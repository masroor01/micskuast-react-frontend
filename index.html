<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logos/mic.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Market Intelligence Cell (MIC) of SKUAST-Kashmir. Dynamic agricultural price predictions, wholesale APMC trends, and horticultural outlook reports." />
    <title>Market Intelligence Cell | SKUAST-K Kashmir</title>
    <script>
      (function() {
        var saved = localStorage.getItem('site_theme');
        if (saved === 'dark' || saved === 'warm') {
          document.documentElement.setAttribute('data-theme', saved);
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
